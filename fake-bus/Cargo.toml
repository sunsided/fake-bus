[package]
name = "fake-bus"
description = "Fake embedded-hal I²C, SPI and delay implementations that drive stateful chip models in host tests"
categories = ["embedded", "development-tools::testing", "no-std"]
keywords = ["embedded-hal", "i2c", "spi", "testing", "simulation"]
readme = "README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true

[dev-dependencies]
embedded-hal-bus.workspace = true
embassy-futures.workspace = true

[package.metadata.release]
pre-release-replacements = [
    { file = "CHANGELOG.md", search = "## \\[Unreleased\\]", replace = "## [Unreleased]\n\n## [{{version}}] - {{date}}\n\n[{{version}}]: https://github.com/sunsided/fake-bus/releases/tag/v{{version}}", exactly = 1 },
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
